[workspace]
members = [
    "crates/ubis-core",
    "crates/ubis-ingest",
    "crates/ubis-git",
    "crates/ubis-cli",
    "crates/ubis-bench",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CREE1116/UBIS"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = "1.8"
ignore = "0.4"
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-java = "0.23"
tempfile = "3"
notify = "8"
rust-stemmers = "1.2"

[profile.release]
debug = false
